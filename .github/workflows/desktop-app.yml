# Builds the Windows installer for the Sticial Studio desktop app (apps/desktop).
#
# Runs on GitHub's Windows machines, which already have Rust and the Visual Studio C++ tools.
# Start it from the Actions tab ("Run workflow"), or push changes under apps/web or apps/desktop.
# The installer is attached to the run as the artifact "sticial-studio-windows".
#
# Releases: push a version tag (git tag v0.2.0 && git push origin v0.2.0). The build then takes its
# version from the tag, signs the update with the TAURI_SIGNING_PRIVATE_KEY secret, and publishes
# a GitHub Release with:
#   Sticial-Studio-Setup.exe        same name every release, so this link always gets the newest:
#                                   https://github.com/nanayawsticial/edtech-ide/releases/latest/download/Sticial-Studio-Setup.exe
#   Sticial-Studio-Setup-<ver>.exe  the same installer, named by version
#   latest.json                     what installed apps read to find updates (tauri.conf.json -> plugins.updater)
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    # Path filters do not apply to tag pushes, so every v* tag builds a release.
    tags: ["v*"]
    paths:
      - "apps/web/**"
      - "apps/desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-app.yml"

env:
  ARDUINO_CLI_VERSION: "1.4.1"

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release on tag builds
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the web app
        working-directory: apps/web
        run: npx tsc --noEmit -p .

      - name: Run the web app's tests (block code generators, circuit parts, Circuit Lab model)
        run: npm test --workspace web

      - name: Lint the web app
        run: npm run lint --workspace web

      - name: Build the web app for desktop (static export to apps/web/out)
        run: npm run build:desktop --workspace web

      - name: Download arduino-cli
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\arduino-cli.zip"
          $url = "https://github.com/arduino/arduino-cli/releases/download/v$env:ARDUINO_CLI_VERSION/arduino-cli_${env:ARDUINO_CLI_VERSION}_Windows_64bit.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $zip
          $bin = "apps/desktop/src-tauri/bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Expand-Archive $zip -DestinationPath $bin -Force
          & "$bin/arduino-cli.exe" version

      # Pre-download the Arduino AVR core and tools so the app's first compile works offline.
      # The app installs them from this cache into the usual Arduino15 folder on first use.
      - name: Bundle the Arduino AVR tools for offline first run
        shell: pwsh
        run: |
          $cli = (Resolve-Path "apps/desktop/src-tauri/bin/arduino-cli.exe").Path
          $staging = "apps/desktop/src-tauri/arduino-staging"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $staging = (Resolve-Path $staging).Path
          $env:ARDUINO_DIRECTORIES_DATA = "$env:RUNNER_TEMP\arduino-data"
          $env:ARDUINO_DIRECTORIES_USER = "$env:RUNNER_TEMP\arduino-user"
          $env:ARDUINO_DIRECTORIES_DOWNLOADS = $staging
          & $cli core update-index
          if ($LASTEXITCODE -ne 0) { throw "core update-index failed" }
          & $cli core install arduino:avr
          if ($LASTEXITCODE -ne 0) { throw "core install failed" }
          # Compile a sketch once so every tool the compiler needs is in the cache too.
          $sketch = "$env:RUNNER_TEMP\Blink"
          New-Item -ItemType Directory -Force $sketch | Out-Null
          Set-Content "$sketch\Blink.ino" "void setup() { pinMode(13, OUTPUT); }`nvoid loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }"
          & $cli compile --fqbn arduino:avr:uno $sketch
          if ($LASTEXITCODE -ne 0) { throw "test compile failed" }
          foreach ($name in "package_index.json", "package_index.json.sig") {
            $source = Join-Path $env:ARDUINO_DIRECTORIES_DATA $name
            if (Test-Path $source) { Copy-Item $source $staging }
          }
          $core = Get-ChildItem "$staging\packages" -Filter "avr-*.tar.bz2" | Select-Object -First 1
          if (-not $core) { throw "AVR core archive not found in the download cache" }
          ($core.Name -replace '^avr-(.*)\.tar\.bz2$', '$1') | Set-Content -NoNewline "$staging\avr-core-version.txt"
          Get-ChildItem -Recurse $staging | Measure-Object -Sum Length | ForEach-Object { "Bundled cache: {0:N1} MB in {1} files" -f ($_.Sum / 1MB), $_.Count }

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Generate app icons
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 icon ../app-icon.png

      - name: Set the app version from the release tag
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tags look like v1.2.3 (got ${{ github.ref_name }})" }
          $path = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Building release $version"

      - name: Build the installer
        if: env.IS_RELEASE != 'true'
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Build the signed release installer
        if: env.IS_RELEASE == 'true'
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings > Secrets and variables > Actions) before releasing." }
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content release.conf.json -Encoding utf8
          npx --yes @tauri-apps/cli@2 build --config release.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Prepare the release files
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $nsis = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found in $nsis" }
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          New-Item -ItemType Directory -Force release | Out-Null
          $versioned = "Sticial-Studio-Setup-$env:RELEASE_VERSION.exe"
          Copy-Item $installer.FullName "release/$versioned"
          Copy-Item $installer.FullName "release/Sticial-Studio-Setup.exe"
          $manifest = [ordered]@{
            version   = $env:RELEASE_VERSION
            notes     = "Sticial Studio $env:RELEASE_VERSION"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$versioned"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content release/latest.json -Encoding utf8
          Get-ChildItem release | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Publish the GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Sticial Studio ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          body: |
            **Install on a new computer:** download `Sticial-Studio-Setup.exe` below and run it. If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**.

            **Already installed?** The app finds this version by itself and offers to update.
          files: |
            release/Sticial-Studio-Setup.exe
            release/Sticial-Studio-Setup-${{ env.RELEASE_VERSION }}.exe
            release/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: sticial-studio-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
